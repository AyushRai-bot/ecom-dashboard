{% extends "base.html" %}

{% block title %}Categories{% endblock %}

{% block content %}
<h2>Product Categories</h2>

<div class="category-grid">
    {% for category in categories %}
    <a href="{{ url_for('products_by_category', category_name=category.category_name) }}" class="category-item">
        <h3>{{ category.category_name }}</h3>
    </a>
    {% endfor %}
</div>
{% endblock %}
